name: Feature request
description: 提一个功能、交互或内容方向的想法
title: "[Idea] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 先描述球迷的场景，而不是直接给方案。
      placeholder: 我想比较 C 罗和另一位球员在欧冠淘汰赛的表现，但现在只能一条条翻。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你的建议
      description: 可以很粗，不需要写技术方案。
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 属于哪一块
      options:
        - Atlas 检索
        - Story 故事
        - 分享卡
        - 数据 / 来源
        - 问答 / 对比
        - 提醒 / bot
        - 社区
        - 其他
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的替代方案
      description: 可选。
    validations:
      required: false
