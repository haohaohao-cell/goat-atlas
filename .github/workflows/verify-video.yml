name: Verify video

on:
  workflow_dispatch:
    inputs:
      url:
        description: "YouTube watch URL"
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check oEmbed metadata
        env:
          VIDEO_URL: ${{ inputs.url }}
        run: node scripts/verify-video.mjs "$VIDEO_URL"
