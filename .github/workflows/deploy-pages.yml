name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    env:
      GITHUB_PAGES: "true"
      NEXT_PUBLIC_BASE_PATH: "/${{ github.event.repository.name }}"
      NEXT_PUBLIC_SITE_URL: "https://${{ github.repository_owner }}.github.io"
      NEXT_PUBLIC_GITHUB_URL: "https://github.com/${{ github.repository }}"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.28.5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Sync live data
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: pnpm sync:live

      - name: Commit live data
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live.json
          if git diff --cached --quiet; then
            echo "No live data changes."
          else
            git commit -m "chore: sync live data"
            git push
          fi

      - name: Validate data
        run: pnpm validate

      - name: Generate match calendar
        run: pnpm calendar

      - name: Build static export
        run: pnpm build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
