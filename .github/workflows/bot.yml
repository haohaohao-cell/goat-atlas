name: Bot notifications

on:
  schedule:
    - cron: "0 0 * * *"
    - cron: "0 6,12,18 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Notification mode"
        required: true
        default: daily
        type: choice
        options:
          - daily
          - check
      dry_run:
        description: "Print messages without sending"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: bot-notifications
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Send notifications
        env:
          BOT_MODE: ${{ github.event.inputs.mode || (github.event.schedule == '0 0 * * *' && 'daily' || 'check') }}
          BOT_DRY_RUN: ${{ github.event.inputs.dry_run }}
          SITE_URL: "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
        run: node scripts/bot.mjs

      - name: Commit bot state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bot-state.json
          if git diff --cached --quiet; then
            echo "No bot state changes."
          else
            git commit -m "chore: update bot notification state"
            git pull --rebase
            git push
          fi
